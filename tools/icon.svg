<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Artwork stays inside 16..112 so the 128px icon has the 16px margin the Chrome Web Store asks for. -->
  <defs>
    <clipPath id="page">
      <rect x="16" y="20" width="96" height="88" rx="14"/>
    </clipPath>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#d9d5f2"/>
      <rect width="3.5" height="8" fill="#b8b0e6"/>
    </pattern>
  </defs>

  <g clip-path="url(#page)">
    <rect x="16" y="20" width="96" height="88" fill="#ffffff"/>
    <!-- Header -->
    <rect x="16" y="20" width="96" height="22" fill="#5b4fc4"/>
    <!-- Shaded night hours: top and bottom of the day -->
    <rect x="16" y="42" width="96" height="24" fill="url(#hatch)"/>
    <rect x="16" y="94" width="96" height="14" fill="url(#hatch)"/>
    <!-- Hour lines in the open part of the day -->
    <rect x="26" y="74" width="76" height="3" rx="1.5" fill="#e3e0f5"/>
    <rect x="26" y="84" width="76" height="3" rx="1.5" fill="#e3e0f5"/>
  </g>
  <rect x="17.5" y="21.5" width="93" height="85" rx="12.5" fill="none" stroke="#5b4fc4" stroke-width="3"/>

  <!-- Crescent moon on the shaded band -->
  <path d="M 92 47 a 9 9 0 1 0 7 14 a 7 7 0 1 1 -7 -14 z" fill="#5b4fc4"/>

  <!-- Binding rings -->
  <rect x="38" y="13" width="8" height="16" rx="4" fill="#3d3399"/>
  <rect x="82" y="13" width="8" height="16" rx="4" fill="#3d3399"/>
</svg>
